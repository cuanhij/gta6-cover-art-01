<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <header>
      <h1>VICE COVER STUDIO</h1>
      <p class="tagline">Multi-panel poster covers, made offline. Your photos never leave this machine.</p>
    </header>

    <fieldset>
      <legend>Layout</legend>
      <div class="layout-row" id="layoutRow">
        <button type="button" data-layout="hero-split" class="layout-btn active" aria-pressed="true">Hero Split</button>
        <button type="button" data-layout="triple-strip" class="layout-btn" aria-pressed="false">Triple Strip</button>
        <button type="button" data-layout="quad" class="layout-btn" aria-pressed="false">Quad</button>
        <button type="button" data-layout="single-hero" class="layout-btn" aria-pressed="false">Single Hero</button>
      </div>
      <p class="hint">Click a panel in the preview to select it.</p>
    </fieldset>

    <fieldset>
      <legend>Selected panel <span id="panelLabel">1</span></legend>
      <label>Photo file
        <input id="photoFile" type="file" accept="image/*">
      </label>
      <div class="sample-row">
        <button type="button" data-sample="boulevard.jpg">Boulevard</button>
        <button type="button" data-sample="pier.jpg">Pier</button>
        <button type="button" data-sample="rider.png">Rider</button>
      </div>
      <label>Zoom <span id="zoomVal">1.00&times;</span>
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
      </label>
      <label>Pan X <span id="oxVal">0</span>
        <input id="ox" type="range" min="-0.5" max="0.5" step="0.01" value="0">
      </label>
      <label>Pan Y <span id="oyVal">0</span>
        <input id="oy" type="range" min="-0.5" max="0.5" step="0.01" value="0">
      </label>
      <p class="hint">Tip: drag the photo on the canvas to pan it.</p>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Title
        <input id="title" type="text" maxlength="30" value="SUNSET HEIST">
      </label>
      <label>Subtitle
        <input id="subtitle" type="text" maxlength="40" value="NEON NIGHTS">
      </label>
      <label>Title style
        <select id="titleStyle">
          <option value="white">White</option>
          <option value="sunset">Sunset gradient</option>
          <option value="neon">Neon outline</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Grade</legend>
      <label>Colour grade
        <select id="grade">
          <option value="vice-sunset">Vice Sunset</option>
          <option value="neon-nights">Neon Nights</option>
          <option value="golden-hour">Golden Hour</option>
          <option value="noir">Noir</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <label>Export size
        <select id="exportSize">
          <option value="1080x1080">1080 &times; 1080 square</option>
          <option value="1080x1350">1080 &times; 1350 portrait</option>
          <option value="1920x1080">1920 &times; 1080 landscape</option>
        </select>
      </label>
      <button id="exportBtn" type="button" class="export">Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>

  <section class="preview">
    <canvas id="cover" width="1080" height="1080" aria-label="Live cover preview"></canvas>
    <p class="preview-hint">Live preview &mdash; panel <span id="previewPanel">1</span> selected</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
